target-version = "py311"

exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "**/__pycache__",
    "node_modules",
    ".ruff_cache",
    "infrastructure",
    "docs",
]

indent-width = 4
line-length = 120

[lint]
select = ["E", "W", "F", "I", "N"]
ignore = ["E501"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/*" = ["T201"]
"infrastructure/*" = ["T201"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
