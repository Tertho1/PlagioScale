services:
  postgres:
    image: postgres:16-alpine
    container_name: plagioscale-postgres
    environment:
      - POSTGRES_DB=plagioscale
      - POSTGRES_USER=plagio
      - POSTGRES_PASSWORD=plagio_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plagio -d plagioscale"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - plagioscale-network
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  redis:
    image: redis:7-alpine
    container_name: plagioscale-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-plagio_redis_pass}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-plagio_redis_pass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - plagioscale-network
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25

  api-service:
    image: ${IMAGE_REPO:-ghcr.io}/${IMAGE_OWNER:-anomalyco}/plagioscale-api-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: api-service/Dockerfile
    user: "65532:65532"
    ports:
      - "8000:8000"
      - "8443:8443"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-plagio_redis_pass}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=plagioscale
      - DB_USER=plagio
      - DB_PASSWORD=plagio_pass
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-plagioscale-2024}
      - WORKER_SECRET=${WORKER_SECRET:-dev-worker-secret-plagioscale-2024}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@plagioscale.local}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - USE_MTLS=${USE_MTLS:-false}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - ./certs:/app/certs:ro
    networks:
      - plagioscale-network
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: ${IMAGE_REPO:-ghcr.io}/${IMAGE_OWNER:-anomalyco}/plagioscale-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3050:80"
    networks:
      - plagioscale-network
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: ${IMAGE_REPO:-ghcr.io}/${IMAGE_OWNER:-anomalyco}/plagioscale-worker:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: worker-service/Dockerfile
    user: "65532:65532"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-plagio_redis_pass}
      - WORKER_ID=
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=plagioscale
      - DB_USER=plagio
      - DB_PASSWORD=plagio_pass
      - PYTHONUNBUFFERED=1
      - USE_MTLS=${USE_MTLS:-false}
      - HF_HOME=/app/hf_cache
      - HF_HUB_DOWNLOAD_TIMEOUT=30
    volumes:
      - uploads_data:/app/uploads
      - worker_storage:/app/storage
      - hf_cache:/app/hf_cache
      - ./certs:/app/certs:ro
    networks:
      - plagioscale-network
    restart: unless-stopped
    mem_limit: 2048m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  autoscaler:
    image: ${IMAGE_REPO:-ghcr.io}/${IMAGE_OWNER:-anomalyco}/plagioscale-autoscaler:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: autoscaler/Dockerfile
    container_name: plagioscale-autoscaler
    user: "0"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-plagio_redis_pass}
      - COMPOSE_PROJECT_NAME=plagioscale
      - SCALE_UP_THRESHOLD=10
      - SCALE_DOWN_THRESHOLD=3
      - MIN_WORKERS=1
      - MAX_WORKERS=5
      - COOLDOWN_SECONDS=20
      - POLL_INTERVAL=5
      - AUTOSCALER_EVENTS_KEY=autoscaler_events
      - PYTHONUNBUFFERED=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./certs:/app/certs:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - plagioscale-network
    restart: unless-stopped
    ports:
      - "8002:8002"
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/metrics')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  monitoring-service:
    image: ${IMAGE_REPO:-ghcr.io}/${IMAGE_OWNER:-anomalyco}/plagioscale-monitoring-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: monitoring-service/Dockerfile
    container_name: plagioscale-monitoring
    user: "0"
    ports:
      - "8090:8090"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-plagio_redis_pass}
      - COMPOSE_PROJECT_NAME=plagioscale
      - AUTOSCALER_EVENTS_KEY=autoscaler_events
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./certs:/app/certs:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - plagioscale-network
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    container_name: plagioscale-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      api-service:
        condition: service_started
      monitoring-service:
        condition: service_started
    networks:
      - plagioscale-network
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  alertmanager:
    image: prom/alertmanager:latest
    container_name: plagioscale-alertmanager
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    depends_on:
      - prometheus
    networks:
      - plagioscale-network
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:9.0.0
    container_name: plagioscale-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    depends_on:
      - prometheus
    networks:
      - plagioscale-network
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  plagioscale-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  worker_storage:
  hf_cache:
  prometheus_data:
  grafana_data:
