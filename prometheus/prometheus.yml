global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - 'alerts.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: "plagioscale"
    static_configs:
      - targets: ['monitoring-service:8090', 'worker:8001', 'autoscaler:8002']
    metrics_path: /metrics
    scheme: http
  # api-service: bare /metrics is JSON for the autoscaler; Prometheus text
  # format is mounted one level deeper.
  - job_name: "plagioscale-api"
    static_configs:
      - targets: ['api-service:8000']
    metrics_path: /metrics/prom
    scheme: http
