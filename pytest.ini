[pytest]
testpaths = shared/tests scripts api-service/tests worker-service/tests autoscaler/tests tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (needs Redis/PostgreSQL)
    e2e: End-to-end tests (full stack)
    load: Load and performance tests
