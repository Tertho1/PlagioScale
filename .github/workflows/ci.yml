name: CI

on:
  push:
    branches: [main, refactor]
  pull_request:
    branches: [main]

env:
  HF_HOME: /home/runner/.cache/huggingface
  GHCR_OWNER: ${{ github.repository_owner }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface
          key: huggingface-models-${{ hashFiles('shared/similarity_scorer.py', 'shared/vectorizer.py') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirementsall.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Pre-download SBERT model (cached)
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L12-v2')"

      - name: Lint with ruff
        run: ruff check .

      - name: Unit tests — shared
        run: pytest shared/tests/ -v --no-header -m "not integration"

      - name: Integration tests — API service
        run: pytest api-service/tests/ -v --no-header

      - name: Integration tests — Worker service
        run: pytest worker-service/tests/ -v --no-header

      - name: Similarity scorer tests
        run: pytest shared/tests/test_similarity_scorer.py -v --no-header

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Frontend tests
        run: npx vitest run
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  build-and-push:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint-and-test, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: api-service
            context: .
            dockerfile: api-service/Dockerfile
          - name: worker
            context: .
            dockerfile: worker-service/Dockerfile
          - name: autoscaler
            context: .
            dockerfile: autoscaler/Dockerfile
          - name: monitoring-service
            context: .
            dockerfile: monitoring-service/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/plagioscale-${{ matrix.service.name }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
