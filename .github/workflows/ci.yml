name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirementsall.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint with ruff
        run: ruff check .

      - name: Unit tests — shared
        run: pytest shared/tests/ -v --no-header -m "not integration"

      - name: Integration tests — API service
        run: pytest api-service/tests/ -v --no-header

      - name: Integration tests — Worker service
        run: pytest worker-service/tests/ -v --no-header

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Frontend tests
        run: npx vitest run
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
